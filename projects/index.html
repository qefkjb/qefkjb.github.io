<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <title>作品 — 个人主页</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #fbfbfd;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: rgba(0, 0, 0, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.72);
            --card-bg: #ffffff;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --code-bg: #f5f5f7;
            --code-text: #1d1d1f;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #1d1d1f;
            --bg-tertiary: #0a0a0c;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #86868b;
            --accent: #2997ff;
            --accent-hover: #47a5ff;
            --border: rgba(255, 255, 255, 0.1);
            --nav-bg: rgba(22, 22, 24, 0.72);
            --card-bg: #1d1d1f;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --card-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.6);
            --code-bg: #0a0a0c;
            --code-text: #f5f5f7;
        }

        /* 暗色主题补充：原生控件配色、文本选区高亮、暗色滚动条 */
        :root { color-scheme: light; }
        [data-theme="dark"] { color-scheme: dark; }

        ::selection {
            background: var(--accent);
            color: #ffffff;
        }

        /* 暗色模式下自定义滚动条，避免 Windows 上浅色滚动条刺眼 */
        [data-theme="dark"] ::-webkit-scrollbar { width: 12px; height: 12px; }
        [data-theme="dark"] ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 6px;
            border: 3px solid var(--bg-secondary);
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: #565658; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.47;
            font-size: 17px;
            letter-spacing: -0.01em;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* Nav */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: var(--nav-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .nav-inner {
            max-width: 1024px;
            margin: 0 auto;
            height: 100%;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo, .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-logo { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
        .nav-link { color: var(--text-secondary); font-size: 13px; }
        .nav-logo:hover, .nav-link:hover { color: var(--accent); }

        .nav-links { display: flex; gap: 24px; align-items: center; }

        .theme-toggle {
            background: none; border: none; cursor: pointer;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .theme-toggle:hover { color: var(--text-primary); transform: scale(1.1); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .sun-icon { display: none; }
        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }

        /* Layout */
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 100px 22px 80px;
        }

        .page-header { margin-bottom: 56px; }

        .eyebrow {
            font-size: 17px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .page-title {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 16px;
        }

        .page-desc {
            font-size: 19px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Project list */
        .posts-list { display: flex; flex-direction: column; gap: 20px; }

        .project-card {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 24px 26px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--card-shadow-hover);
            border-color: var(--accent);
        }

        .project-card-emoji {
            font-size: 44px;
            line-height: 1;
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: 14px;
        }

        .project-card-body { flex: 1; min-width: 0; }

        .project-card-date {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 6px;
        }

        .project-card-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        .project-card-excerpt {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 12px;
        }

        .project-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }

        .tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 980px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .empty, .loading {
            text-align: center;
            color: var(--text-tertiary);
            padding: 60px 20px;
            font-size: 15px;
        }

        /* Project view */
        .post-view { display: none; }
        .post-view.active { display: block; }
        .posts-list.hidden { display: none; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
            cursor: pointer;
            transition: gap 0.3s ease;
        }
        .back-link:hover { gap: 8px; }

        .post-emoji {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 16px;
        }

        .post-meta {
            color: var(--text-tertiary);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .post-title {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 16px;
        }

        .post-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
            transition: background 0.2s;
        }
        .post-link:hover { background: var(--accent-hover); }

        /* Markdown content */
        .markdown {
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 17px;
        }

        .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-top: 1.8em;
            margin-bottom: 0.6em;
        }

        .markdown h1 { font-size: 32px; margin-top: 0; }
        .markdown h2 { font-size: 26px; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
        .markdown h3 { font-size: 21px; }
        .markdown h4 { font-size: 17px; color: var(--text-secondary); }

        .markdown p { margin: 1em 0; color: var(--text-secondary); }
        .markdown strong { color: var(--text-primary); font-weight: 600; }

        .markdown a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }
        .markdown a:hover { border-bottom-color: var(--accent); }

        .markdown ul, .markdown ol { margin: 1em 0; padding-left: 1.5em; color: var(--text-secondary); }
        .markdown li { margin: 0.4em 0; }
        .markdown ul li::marker { color: var(--accent); }

        .markdown blockquote {
            margin: 1.5em 0;
            padding: 8px 20px;
            border-left: 3px solid var(--accent);
            background: var(--bg-secondary);
            border-radius: 0 12px 12px 0;
            color: var(--text-secondary);
        }

        .markdown code {
            font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
            font-size: 0.88em;
            background: var(--code-bg);
            color: var(--code-text);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .markdown pre {
            margin: 1.5em 0;
            padding: 18px 20px;
            background: var(--code-bg);
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--border);
            line-height: 1.5;
        }

        .markdown pre code {
            background: none;
            padding: 0;
            font-size: 14px;
            color: var(--code-text);
        }

        .markdown img { max-width: 100%; height: auto; border-radius: 12px; margin: 1.5em 0; }

        .markdown hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

        .markdown table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-size: 15px;
        }

        .markdown th, .markdown td {
            padding: 10px 14px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .markdown th { background: var(--bg-secondary); font-weight: 600; color: var(--text-primary); }
        .markdown td { color: var(--text-secondary); }

        /* Footer */
        .footer {
            padding: 32px 22px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
            border-top: 1px solid var(--border);
        }
        .footer a { color: var(--text-secondary); text-decoration: none; }
        .footer a:hover { color: var(--accent); }

        /* Comments */
        .comments {
            margin-top: 64px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }

        .comments-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }

        #comments-container iframe {
            width: 100%;
            border: 0;
            min-height: 200px;
        }

        /* Search */
        .search-box {
            position: relative;
            max-width: 560px;
            margin: 0 auto 40px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 44px;
            font-size: 15px;
            color: var(--text-primary);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
        }

        .search-input::placeholder { color: var(--text-tertiary); }

        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: 0;
            border-radius: 50%;
            background: var(--border);
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.2s;
        }

        .search-clear:hover { background: var(--text-tertiary); color: var(--text-primary); }

        @media (max-width: 768px) {
            .container { padding: 80px 18px 60px; }
            .project-card { padding: 20px; gap: 14px; }
            .project-card-emoji { width: 48px; height: 48px; font-size: 32px; }
            .project-card-title { font-size: 19px; }
        }
    </style>
    <script>
        // 尽早应用主题，避免暗色模式下的白屏闪烁（FOUC）
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                var root = document.documentElement;
                root.setAttribute('data-theme', theme);
                root.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
</head>
<body data-theme="light">
    <nav class="nav">
        <div class="nav-inner">
            <a class="nav-logo" href="../">个人主页</a>
            <div class="nav-links">
                <a class="nav-link" href="./">作品</a>
                <a class="nav-link" href="../blog/">博客</a>
                <a class="nav-link" href="../#contact">联系</a>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">

    <main class="container">
        <!-- List view -->
        <div id="list-view">
            <header class="page-header">
                <p class="eyebrow">Projects</p>
                <h1 class="page-title">作品</h1>
                <p class="page-desc">算法不只是赛场上的较量，更是值得分享的思维方式。这里是我整理的部分作品。</p>
            </header>

            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="搜索作品标题、标签或正文…" autocomplete="off">

    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script>
        // 作品列表来自 manifest.json（由 build-blog.py 生成）
        // 作品正文直接 fetch 对应的 .md 文件渲染，无需 GitHub API
        // 评论使用 Giscus（基于 GitHub Discussions）
        const GISCUS_REPO = 'qefkjb/qefkjb.github.io';
        const GISCUS_REPO_ID = 'R_kgDOTcWjZQ';
        const GISCUS_CATEGORY = 'Announcements';
        const GISCUS_CATEGORY_ID = 'DIC_kwDOTcWjZc4DCdEK';
        let currentPostSlug = '';

        let allPosts = [];
        const bodyCache = {};

        function syncCommentsTheme(theme) {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (iframe) {
                iframe.contentWindow.postMessage({
                    giscus: { setConfig: { theme: theme === 'dark' ? 'dark_dimmed' : 'light' } }
                }, 'https://giscus.app');
            }
        }

        function toggleTheme() {
            const root = document.documentElement;
            const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            root.style.colorScheme = newTheme;
            localStorage.setItem('theme', newTheme);
            syncCommentsTheme(newTheme);
        }
        (function initTheme() {
            const saved = localStorage.getItem('theme');
            const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        })();

        function stripFrontmatter(content) {
            return content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
        }

        function extractExcerpt(body, len = 160) {
            const text = body
                .replace(/^#+\s.*$/gm, '')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\[(.*?)\]\(.*?\)/g, '$1')
                .replace(/[#*`>_~]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            return text.length > len ? text.slice(0, len) + '…' : text;
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function loadAllPosts() {
            const listEl = document.getElementById('posts-list');
            try {
                const resp = await fetch('manifest.json');
                if (!resp.ok) throw new Error('manifest: ' + resp.status);
                allPosts = await resp.json();
                if (!Array.isArray(allPosts)) allPosts = [];
                renderList();
                prefetchBodies();
                handleHashChange();
            } catch (e) {
                console.warn('Projects load failed:', e);
                listEl.innerHTML = '<div class="empty">作品列表加载失败。<br>请先运行 <code>python build-blog.py</code> 生成 <code>projects/manifest.json</code>。<br>本地预览请用 <code>python -m http.server</code> 启动服务。</div>';
            }
        }

        function prefetchBodies() {
            allPosts.forEach(async p => {
                if (bodyCache[p.slug]) return;
                try {
                    const r = await fetch(p.file);
                    bodyCache[p.slug] = await r.text();
                    if (currentQuery) renderList();
                } catch (e) { /* 忽略 */ }
            });
        }

        let currentQuery = '';

        function countMatches(haystack, needle) {
            if (!haystack || !needle) return 0;
            return haystack.toLowerCase().split(needle).length - 1;
        }

        function filterPosts(query) {
            const q = query.trim().toLowerCase();
            if (!q) return allPosts;
            return allPosts
                .map(p => {
                    const titleCount = countMatches(p.title, q);
                    const tagsCount = countMatches(p.tags, q);
                    const summaryCount = countMatches(p.summary, q);
                    const body = bodyCache[p.slug];
                    const bodyCount = body ? countMatches(stripFrontmatter(body), q) : 0;
                    return { post: p, score: titleCount + tagsCount + summaryCount + bodyCount };
                })
                .filter(x => x.score > 0)
                .sort((a, b) => b.score - a.score)
                .map(x => x.post);
        }

        function renderList() {
            const listEl = document.getElementById('posts-list');
            if (allPosts.length === 0) {
                listEl.innerHTML = '<div class="empty">还没有作品。在 /projects 目录下放入 .md 文件，运行 <code>python build-blog.py</code> 后即可显示。</div>';
                return;
            }
            const posts = filterPosts(currentQuery);
            if (posts.length === 0) {
                listEl.innerHTML = `<div class="empty">没有匹配「${escapeHtml(currentQuery)}」的作品。</div>`;
                return;
            }
            listEl.innerHTML = posts.map(p => {
                const tags = p.tags
                    ? p.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('')
                    : '';
                const emoji = p.emoji || '📄';
                return `
                    <a class="project-card" href="#${p.slug}">
                        <div class="project-card-emoji">${emoji}</div>
                        <div class="project-card-body">
                            <div class="project-card-date">${p.date || '未署日期'}</div>
                            <h2 class="project-card-title">${p.title}</h2>
                            <p class="project-card-excerpt" data-slug="${p.slug}">${p.summary ? escapeHtml(p.summary) : '加载中…'}</p>
                            <div class="project-card-tags">${tags}</div>
                        </div>
                    </a>`;
            }).join('');
            // 没有 summary 的，从正文提取摘要
            posts.forEach(async p => {
                if (p.summary) return;
                const el = listEl.querySelector(`[data-slug="${p.slug}"]`);
                if (!el) return;
                if (bodyCache[p.slug]) {
                    el.textContent = extractExcerpt(stripFrontmatter(bodyCache[p.slug]));
                } else {
                    try {
                        const r = await fetch(p.file);
                        const txt = await r.text();
                        bodyCache[p.slug] = txt;
                        if (el) el.textContent = extractExcerpt(stripFrontmatter(txt));
                    } catch (e) { /* 忽略 */ }
                }
            });
        }

        (function bindSearch() {
            const input = document.getElementById('search-input');
            const clear = document.getElementById('search-clear');
            if (!input) return;
            let timer = null;
            input.addEventListener('input', e => {
                currentQuery = e.target.value;
                clear.style.display = currentQuery ? 'flex' : 'none';
                clearTimeout(timer);
                timer = setTimeout(renderList, 120);
            });
            clear.addEventListener('click', () => {
                input.value = '';
                currentQuery = '';
                clear.style.display = 'none';
                renderList();
                input.focus();
            });
        })();

        function showList() {
            history.replaceState(null, '', './');
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('post-view').classList.remove('active');
            const cc = document.getElementById('comments-container');
            if (cc) cc.innerHTML = '';
            currentPostSlug = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.title = '作品 — 个人主页';
        }

        async function showPost(slug) {
            const post = allPosts.find(p => p.slug === slug);
            if (!post) { showList(); return; }

            document.getElementById('post-emoji').textContent = post.emoji || '📄';
            document.getElementById('post-title').textContent = post.title;
            const tags = post.tags
                ? post.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join(' ')
                : '';
            document.getElementById('post-meta').innerHTML = `${post.date || '未署日期'} ${tags ? '· ' + tags : ''}`;

            const linkEl = document.getElementById('post-link');
            if (post.link) {
                linkEl.href = post.link;
                linkEl.style.display = 'inline-flex';
            } else {
                linkEl.style.display = 'none';
            }

            const contentEl = document.getElementById('post-content');
            contentEl.innerHTML = '<p>加载中…</p>';

            document.getElementById('list-view').style.display = 'none';
            document.getElementById('post-view').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'auto' });
            document.title = `${post.title} — 作品`;

            try {
                let txt = bodyCache[slug];
                if (!txt) {
                    const r = await fetch(post.file);
                    txt = await r.text();
                    bodyCache[slug] = txt;
                }
                contentEl.innerHTML = marked.parse(stripFrontmatter(txt));
                protectMedia(contentEl);
            } catch (e) {
                contentEl.innerHTML = '<p>作品内容加载失败。</p>';
            }

            loadComments(slug);
        }

        // 媒体保护：禁右键/拖拽/选择 + 图片 Canvas 水印
        // 说明：纯静态站无法真正防下载，此方案挡普通用户，F12 仍可破
        const WATERMARK_TEXT = 'qefkjb.github.io';
        function protectMedia(root) {
            root.addEventListener('contextmenu', e => e.preventDefault());
            root.querySelectorAll('img').forEach(img => {
                if (img.dataset.protected) return;
                img.dataset.protected = '1';
                img.draggable = false;
                img.style.userSelect = 'none';
                img.style.webkitUserDrag = 'none';
                const apply = () => watermarkImage(img);
                if (img.complete) apply();
                else img.addEventListener('load', apply, { once: true });
            });
            root.querySelectorAll('video, audio').forEach(m => {
                if (m.dataset.protected) return;
                m.dataset.protected = '1';
                m.controlsList = 'nodownload noplaybackrate';
                m.disablePictureInPicture = true;
                m.addEventListener('contextmenu', e => e.preventDefault());
            });
        }
        function watermarkImage(img) {
            const w = img.naturalWidth, h = img.naturalHeight;
            if (!w || !h) return;
            // 用 crossOrigin 重新加载图片，避免 canvas 被污染
            const loader = new Image();
            loader.crossOrigin = 'anonymous';
            loader.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(loader, 0, 0, w, h);
                    ctx.save();
                    ctx.globalAlpha = 0.22;
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.font = `${Math.max(14, Math.floor(w / 28))}px -apple-system, sans-serif`;
                    ctx.translate(w / 2, h / 2);
                    ctx.rotate(-Math.PI / 7);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const step = Math.max(120, w / 6);
                    for (let y = -h; y < h; y += step) {
                        for (let x = -w; x < w; x += step) {
                            ctx.strokeText(WATERMARK_TEXT, x, y);
                            ctx.fillText(WATERMARK_TEXT, x, y);
                        }
                    }
                    ctx.restore();
                    img.src = canvas.toDataURL('image/png');
                } catch (e) {
                    console.warn('水印添加失败:', e);
                }
            };
            loader.onerror = () => console.warn('水印图加载失败（CORS 不支持）:', img.src);
            loader.src = img.src;
        }

        function loadComments(slug) {
            const container = document.getElementById('comments-container');
            if (!container) return;
            if (currentPostSlug === slug && container.innerHTML) return;
            currentPostSlug = slug;
            container.innerHTML = '';
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark_dimmed' : 'light';
            const script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.async = true;
            script.crossOrigin = 'anonymous';
            script.setAttribute('data-repo', GISCUS_REPO);
            script.setAttribute('data-repo-id', GISCUS_REPO_ID);
            script.setAttribute('data-category', GISCUS_CATEGORY);
            script.setAttribute('data-category-id', GISCUS_CATEGORY_ID);
            script.setAttribute('data-mapping', 'title');
            script.setAttribute('data-strict', '0');
            script.setAttribute('data-reactions-enabled', '1');
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', 'top');
            script.setAttribute('data-theme', theme);
            script.setAttribute('data-lang', 'zh-CN');
            script.setAttribute('data-loading', 'lazy');
            script.onerror = () => {
                container.innerHTML = '<p style="color:var(--text-secondary);font-size:14px;padding:12px 0;">评论加载失败（<code>giscus.app</code> 被拦截）。请关闭广告拦截插件、跟踪保护或浏览器隐私盾后刷新，或在无痕窗口中打开本页。</p>';
            };
            container.appendChild(script);
        }

        function handleHashChange() {
            const slug = window.location.hash.slice(1);
            if (slug && allPosts.some(p => p.slug === slug)) {
                showPost(slug);
            } else {
                showList();
            }
        }

        window.addEventListener('hashchange', handleHashChange);
        loadAllPosts();
    </script>
</body>
</html>
